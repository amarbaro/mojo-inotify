# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.5

package:
  name: "mojo-inotify"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/inotify -o ${{ PREFIX }}/lib/mojo/inotify.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-inotify
  license: Apache-2.0
  license_file: LICENSE
  summary: Watch files and directories from Mojo with Linux inotify, pollable
  repository: https://github.com/amarbaro/mojo-inotify

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-inotify
